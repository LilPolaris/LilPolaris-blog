version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "10:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      hexo:
        patterns:
          - "hexo*"
      npm-dependencies:
        patterns:
          - "*"
