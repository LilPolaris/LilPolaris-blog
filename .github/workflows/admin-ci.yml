name: Admin CI

on:
  push:
    branches:
      - main
    paths:
      - "admin/**"
      - "打开博客后台.cmd"
      - ".github/workflows/admin-ci.yml"
  pull_request:
    paths:
      - "admin/**"
      - "打开博客后台.cmd"
      - ".github/workflows/admin-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  launcher-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Windows launcher core
        shell: powershell
        run: .\admin\scripts\launcher-core.tests.ps1
