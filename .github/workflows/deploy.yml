name: Deploy Hexo Site

on:
  push:
    branches:
      - main
    paths-ignore:
      - "admin/**"
      - ".github/workflows/admin-ci.yml"
  workflow_dispatch:

concurrency:
  group: hexo-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure deploy key
        env:
          DEPLOY_KEY: ${{ secrets.HEXO_DEPLOY_KEY }}
        run: |
          test -n "$DEPLOY_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 443 ssh.github.com >> ~/.ssh/known_hosts

      - name: Push generated site
        run: |
          cd public
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b main
          git add -A
          git commit --allow-empty -m "Site updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git remote add origin "ssh://git@ssh.github.com:443/LilPolaris/LilPolaris.github.io.git"
          git push --force origin main
