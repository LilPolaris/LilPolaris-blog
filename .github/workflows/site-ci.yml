name: Site CI

on:
  pull_request:
    paths:
      - ".github/workflows/site-ci.yml"
      - "_config*.yml"
      - "package.json"
      - "package-lock.json"
      - "scaffolds/**"
      - "scripts/**"
      - "source/**"
      - "themes/**"
      - "tools/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Hexo site
        run: npm run build

      - name: Upload generated site
        uses: actions/upload-artifact@v4
        with:
          name: hexo-public
          path: public
          if-no-files-found: error
          retention-days: 7
